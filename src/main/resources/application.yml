spring:
  application:
    name: demo

  main:
    web-application-type: none

grpc:
  enable-reflection: true

  datasource:
    url: jdbc:mysql://localhost:3306/products_local
    username: ${USERNAME}
    password: ${PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
