spring:
  application:
    name: demo

  main:
    web-application-type: none

  temporal:
    connection:
      target: local
    workers:
      - task-queue: products-queue
    workersAutoDiscovery:
      packages:
        - com.example.product.temporal

  datasource:
    url: jdbc:mysql://localhost:5306/products_local
    username: ${USERNAME}
    password: ${PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

grpc:
  enable-reflection: true