[versions]
spring-boot = "3.4.4"
spring-dependency-management = "1.1.6"
kotlin = "2.2.0"
protobuf-plugin = "0.9.5"
spotless = "7.2.1"
grpc = "1.81.0"
protobuf-java = "3.25.5"
lognet-grpc = "5.2.0"
mapstruct = "1.5.5.Final"
temporal = "1.40.0"
ktlint = "1.5.0"
google-java-format = "1.25.2"

[libraries]
# Spring Boot
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# gRPC
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
lognet-grpc-starter = { module = "io.github.lognet:grpc-spring-boot-starter", version.ref = "lognet-grpc" }
# Jakarta
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api" }
# MySQL
mysql-connector = { module = "com.mysql:mysql-connector-j" }
# MapStruct
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
# Temporal
temporal-spring-boot = { module = "io.temporal:temporal-spring-boot-starter", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
# Testing
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
