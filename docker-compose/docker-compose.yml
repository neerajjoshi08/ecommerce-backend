services:

  # Product database
  mysql_products:
    image: mysql:${MYSQL_PRODUCTS_VERSION}
    container_name: products-service-mysql
    ports:
      - "5306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ../scripts:/docker-entrypoint-initdb.d/:ro

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    ports:
      - "9200:9200"
    volumes:
      - temporal-elasticsearch-v8-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Temporal MySQL
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: temporal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - temporal-network
    ports:
      - "3306:3306"
    volumes:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Temporal database and Elasticsearch schema initialization
  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-admin-tools
    restart: on-failure:6
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: 3306

      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_SEEDS: mysql
      SQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_SCHEME: http
      ES_VERSION: v8
      ES_VISIBILITY_INDEX: temporal_visibility_v1_dev

    networks:
      - temporal-network

    volumes:
      - ./temporal-scripts:/scripts:ro

    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-mysql-es.sh"]

  # Temporal Server
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION}
    container_name: temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully

    environment:
      DB: mysql8
      DB_PORT: 3306

      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_SEEDS: mysql

      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml

      ENABLE_ES: "true"
      ES_SEEDS: elasticsearch
      ES_VERSION: v8
      ES_VIS_INDEX: temporal_visibility_v1_dev

      BIND_ON_IP: 0.0.0.0

    networks:
      - temporal-network

    ports:
      - "7233:7233"

    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  # Create default Temporal namespace
  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-create-namespace
    depends_on:
      temporal:
        condition: service_healthy

    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 24h

    networks:
      - temporal-network

    volumes:
      - ./temporal-scripts:/scripts:ro

    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy

    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
      TEMPORAL_CSRF_COOKIE_INSECURE: "true"

    networks:
      - temporal-network

    ports:
      - "8080:8080"


networks:
  temporal-network:
    driver: bridge
    name: temporal-network


volumes:
  temporal-elasticsearch-v8-data:
